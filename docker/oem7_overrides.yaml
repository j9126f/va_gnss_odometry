# Overrides aos parâmetros do driver NovAtel OEM7 (carregados por último no launch file).
#
# O SPAN-IGM-S1 tem firmware OEM6:
#  - rejeita alguns logs OEM7 (INSCONFIG, CORRIMUS, INSSTDEV, efemérides Galileo F/I-NAV),
#    e em modo strict o driver deixava de publicar posição/INS;
#  - PPPPOS e BESTGNSSPOS trazem stn_id = 4 bytes nulos (sem estação base) e o driver
#    aborta ao publicá-los ("The string contains null characters"). BESTPOS não é afetado.
#  - TERRASTAR* também têm strings e não são precisos.
oem7_strict_receiver_init: false

# Sem INSCONFIG o driver não sabe a taxa do IMU (ADIS16488 = 200 Hz); sem ela não publica imu/data_raw.
oem7_imu_rate: 200

# Mesmo assim o driver não publica imu/data nem imu/data_raw: os fatores de escala do IMU vêm do
# INSCONFIG, que o OEM6 não tem. Publica-se então o RAWIMUSX descodificado (contagens brutas, 200 Hz):
# ADIS16488 -> acel: x * 200/2^31 m/s por amostra; giro: x * 720/2^31 graus por amostra (multiplicar
# por 200 Hz para obter m/s² e °/s). Orientação: usar /novatel/oem7/inspva (roll, pitch, azimuth).
RAWIMUSX: {topic: rawimusx, frame_id: imu_link}

receiver_init_commands:
- "UNLOGALL THISPORT"
- "LOG RXSTATUSB ONCHANGED"
- "LOG BESTPOSB ONTIME 0.1"
- "LOG BESTVELB ONTIME 0.1"
- "LOG BESTGNSSVELB ONTIME 0.1"
- "LOG BESTUTMB ONTIME 1"
- "LOG HEADING2B ONNEW"
- "LOG PSRDOP2B ONCHANGED"
- "LOG INSPVASB ONTIME 0.02"
- "LOG INSPVAXB ONTIME 1"
- "LOG RAWIMUSXB ONNEW"
- "LOG TIMEB ONTIME 1"
- "LOG VERSIONB ONCE"
- "LOG INSUPDATESTATUSB ONNEW"
- "LOG RAWEPHEMB ONNEW"
- "LOG GLOEPHEMERISB ONNEW"
- "LOG BDSEPHEMERISB ONNEW"
- "LOG RANGEB ONTIME 1"
